services:
  kakinns-blog:
    image: kakinns-blog:${IMAGE_TAG:-latest}
    container_name: kakinns-blog
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NUXT_ADMIN_USERNAME: ${NUXT_ADMIN_USERNAME:-admin}
      NUXT_ADMIN_PASSWORD: ${NUXT_ADMIN_PASSWORD:-admin}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:-please-change-this}
      NUXT_GITHUB_TOKEN: ${NUXT_GITHUB_TOKEN:-}
      NUXT_GITHUB_OWNER: ${NUXT_GITHUB_OWNER:-}
      NUXT_GITHUB_REPO: ${NUXT_GITHUB_REPO:-}
      NUXT_GITHUB_BRANCH: ${NUXT_GITHUB_BRANCH:-master}
      NUXT_GITHUB_COMMITTER_NAME: ${NUXT_GITHUB_COMMITTER_NAME:-Kakinn Studio Bot}
      NUXT_GITHUB_COMMITTER_EMAIL: ${NUXT_GITHUB_COMMITTER_EMAIL:-bot@kakinn.studio}
      NUXT_GITHUB_BASE_URL: ${NUXT_GITHUB_BASE_URL:-}
      NUXT_PUBLIC_SITE_COMMIT_SHA: ${NUXT_PUBLIC_SITE_COMMIT_SHA:-}
      NUXT_PUBLIC_SITE_BUILD_TIME: ${NUXT_PUBLIC_SITE_BUILD_TIME:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
      TEST_ENV: ${TEST_ENV:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,.aliyuncs.com
    dns:
      - 223.5.5.5
      - 114.114.114.114
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
